<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게임</title>
    <style>
        /* 게임 배경과 텍스트 스타일 */
        body { 
            margin: 0; padding: 0; 
            background-color: #111; color: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; font-family: 'Malgun Gothic', sans-serif; 
            overflow: hidden;
        }
        /* 게임 화면(캔버스) 테두리와 네온 효과 */
        canvas { 
            background-color: #1a1a1a; 
            border: 3px solid #333; 
            box-shadow: 0 0 30px rgba(255, 8, 68, 0.2); 
            border-radius: 5px;
        }
        h1 { margin-bottom: 5px; text-shadow: 0 0 15px rgba(255, 8, 68, 0.8); }
        #scoreBoard { font-size: 22px; margin-bottom: 20px; font-weight: bold; color: #aaa; }
        #score { color: #00f2fe; font-size: 28px; }
        .instructions { margin-top: 15px; color: #777; font-size: 14px; }
    </style>
</head>
<body>

<h1>영역 생존: 저주 피하기</h1>
<div id="scoreBoard">생존 점수: <span id="score">0</span></div>
<canvas id="gameCanvas" width="500" height="500"></canvas>
<div class="instructions">조작법: 방향키(←, ↑, →, ↓)를 사용해 붉은 저주를 피하세요!</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    // 생존자(플레이어) 설정
    let player = { 
        x: 235, y: 450, 
        width: 30, height: 30, 
        speed: 6, 
        color: '#00f2fe' 
    };
    
    let enemies = [];
    let score = 0;
    let gameOver = false;
    let keys = {};

    // 키보드 입력 감지 (다중 키 입력 지원)
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // 적(저주) 스폰 함수
    function spawnEnemy() {
        let size = Math.random() * 20 + 15; // 크기 랜덤
        let x = Math.random() * (canvas.width - size); // 위치 랜덤
        let speed = Math.random() * 4 + 3; // 떨어지는 속도 랜덤
        
        enemies.push({ 
            x: x, y: -30, 
            width: size, height: size, 
            speed: speed, 
            color: '#ff0844' 
        });
    }

    // 메인 게임 루프
    function update() {
        if (gameOver) return;

        // 1. 플레이어 이동 처리 (화면 밖으로 못 나가게 제한)
        if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
        if (keys['ArrowRight'] && player.x + player.width < canvas.width) player.x += player.speed;
        if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
        if (keys['ArrowDown'] && player.y + player.height < canvas.height) player.y += player.speed;

        // 2. 화면 지우기 (매 프레임마다 새로 그림)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 3. 플레이어 그리기 (네온 발광 효과)
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.shadowBlur = 0; // 다른 도형에 영향 안 주게 초기화

        // 4. 적 이동, 그리기 및 히트박스 충돌 판정
        for (let i = 0; i < enemies.length; i++) {
            let enemy = enemies[i];
            enemy.y += enemy.speed; // 아래로 이동

            ctx.fillStyle = enemy.color;
            ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

            // AABB(Axis-Aligned Bounding Box) 방식 히트박스 충돌 검사
            if (player.x < enemy.x + enemy.width &&
                player.x + player.width > enemy.x &&
                player.y < enemy.y + enemy.height &&
                player.y + player.height > enemy.y) {
                
                gameOver = true;
                setTimeout(() => {
                    alert(`[게임 오버] 영역 붕괴!\n최종 생존 점수: ${score}점\n새로고침(F5)을 눌러 다시 도전하세요.`);
                }, 10);
            }

            // 적이 바닥에 닿으면 점수 증가 및 배열에서 제거
            if (enemy.y > canvas.height) {
                enemies.splice(i, 1);
                i--;
                score++;
                scoreElement.innerText = score;
            }
        }

        // 5. 난이도 증가 시스템 (시간이 지날수록 스폰 확률 상승)
        let spawnRate = 0.04 + (score * 0.0005);
        if (Math.random() < spawnRate) {
            spawnEnemy();
        }

        // 다음 프레임 요청
        requestAnimationFrame(update);
    }

    // 게임 루프 시작
    update();
</script>

</body>
</html>
